{% include '_slide_head.html' %}
<style>
html, body { width: 1080px; height: 1920px; }
.wrap { padding: 100px 80px 220px; }
</style>
<body>
  <div class="wrap" style="align-items:center;">
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;">
      <div style="font-size:32px; color:var(--muted);">{{ brand.handle }}</div>
      <div class="h1" style="font-size:120px; line-height:1.05; text-transform:uppercase; margin-top:24px;">{{ hook }}</div>
      {% if matchup %}
      <div style="margin-top:44px; font-size:50px;">{{ matchup }}</div>
      {% endif %}
      {% if bet_label %}
      <div style="margin-top:34px;"><span class="chip h1" style="font-size:44px;">{{ bet_label }} <span class="accent">{{ odds }}</span></span></div>
      {% endif %}
      {% if conf_display %}
      <div style="margin-top:30px; font-size:34px; color:var(--muted);">Confidence: <span class="accent h1">{{ conf_display }}</span></div>
      {% endif %}
      <div style="margin-top:10px; font-size:28px; color:var(--muted);">Poll sticker spot: TAIL or FADE?</div>
    </div>
  </div>
  <div class="disclaimer" style="bottom:40px; font-size:14px;">{{ disclaimer }}</div>
</body>
</html>
