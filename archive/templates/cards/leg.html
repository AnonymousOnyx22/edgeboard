{% include '_slide_head.html' %}
<body>
  <div class="wrap">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span class="chip">LEG {{ leg_num }} / {{ total_legs }}</span>
      <span class="chip">{{ slate_label }}</span>
    </div>

    <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
      <div class="h1" style="font-size:72px; text-transform:uppercase;">{{ matchup }}</div>

      <div style="margin-top:34px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12);
                   border-radius:24px; padding:34px 36px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div class="h1" style="font-size:52px;">{{ bet_label }}</div>
          <div class="h1 accent" style="font-size:52px;">{{ odds }}</div>
        </div>
        <div class="meter"><div class="meter-fill" style="width: {{ conf_pct }}%;"></div></div>
        <div style="margin-top:14px; display:flex; justify-content:space-between;">
          <span class="small" style="font-size:22px;">Confidence</span>
          <span class="h1 accent" style="font-size:28px;">{{ conf_display }}</span>
        </div>
      </div>

      {% if support_stat %}
      <div style="margin-top:30px; font-size:30px; color:var(--muted);">{{ support_stat }}</div>
      {% endif %}
      {% if reason %}
      <div class="emo" style="margin-top:26px; font-size:34px;">{{ reason }}</div>
      {% endif %}
    </div>
  </div>
  <div class="disclaimer">{{ disclaimer }}</div>
</body>
</html>
