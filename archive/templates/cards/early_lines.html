{% include '_slide_head.html' %}
<body>
  <div class="wrap">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span class="chip">EARLY LINES</span>
      <span class="chip">Week {{ ep.week | default('?') }}</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
      <div class="h1" style="font-size:76px; text-transform:uppercase;">Lines I'm watching</div>
      <div style="margin-top:40px; display:flex; flex-direction:column; gap:14px;">
        {% for line in lines %}
        <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.05);
                    border-radius:16px; padding:20px 26px;">
          <span style="font-size:28px;">{{ line.matchup }}</span>
          <span class="h1 accent" style="font-size:30px;">{{ line.line_label }}</span>
          <span style="color:var(--muted); font-size:24px;">{{ line.note }}</span>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
  <div class="disclaimer">{{ disclaimer }}</div>
</body>
</html>
