{% include '_slide_head.html' %}
<body>
  <div class="wrap">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span class="chip">{{ sport_emoji }} {{ sport_label | upper }}</span>
      <span class="chip">{{ ep.date }}</span>
    </div>

    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:8px;">
      <div style="font-size:30px; color:var(--muted);">{{ brand.handle }} · Episode {{ ep.number }}</div>
      <div class="h1" style="font-size:88px; line-height:1.05; text-transform:uppercase;">{{ hook }}</div>
      {% if combined_odds %}
      <div style="margin-top:28px">
        <span class="chip" style="font-size:26px;">Total odds <span class="accent" style="font-weight:700;">{{ combined_odds }}</span></span>
      </div>
      {% endif %}
      {% if top_conf %}
      <div style="margin-top:16px; font-size:26px; color:var(--muted);">
        Top confidence: <span class="accent h1" style="font-size:34px;">{{ top_conf }}</span>
      </div>
      {% endif %}
      <div class="emo" style="margin-top:8px; font-size:40px;">SWIPE ➡️</div>
    </div>
  </div>
  <div class="disclaimer">{{ disclaimer }}</div>
</body>
</html>
