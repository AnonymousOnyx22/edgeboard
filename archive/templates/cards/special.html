{% include '_slide_head.html' %}
<body>
  <div class="wrap" style="align-items:center;">
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;">
      <div class="emo" style="font-size:110px;">{{ emoji }}</div>
      <div class="h1" style="font-size:84px; text-transform:uppercase; margin-top:24px;">{{ hook }}</div>
      {% if subtitle %}
      <div style="margin-top:28px; font-size:34px; color:var(--muted);">{{ subtitle }}</div>
      {% endif %}
      <div style="margin-top:40px; font-size:26px; color:var(--muted);">{{ brand.handle }}</div>
    </div>
  </div>
  <div class="disclaimer">{{ disclaimer }}</div>
</body>
</html>
