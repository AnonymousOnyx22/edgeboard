<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family={{ brand.fonts.heading | replace(' ', '+') }}&family={{ brand.fonts.body | replace(' ', '+') }}&display=swap');

:root {
  --accent: {{ brand.colors.accent }};
  --good: {{ brand.colors.good }};
  --bad: {{ brand.colors.bad }};
  --neutral: {{ brand.colors.neutral }};
  --bg: {{ brand.colors.primary }};
  --txt: {{ brand.colors.text_light }};
  --muted: {{ brand.colors.text_muted }};
  --sport: {{ brand.sport_accents.get(sport, brand.colors.accent) if sport else brand.colors.accent }};
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1350px; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--txt);
  font-family: "{{ brand.fonts.body }}", sans-serif;
  display: flex; flex-direction: column;
  position: relative;
}
.wrap { padding: 72px 76px 60px; height: 100%; display: flex; flex-direction: column; }
.h1 { font-family: "{{ brand.fonts.heading }}", sans-serif; font-weight: 700; }
.accent { color: var(--accent); }
.bad { color: var(--bad); }
.good { color: var(--good); }
.small { color: var(--muted); }
.emo{ font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif; }
.brand-foot { margin-top: auto; text-align: center; color: var(--muted); font-size: 14px; letter-spacing: 2px; }
.disclaimer { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center;
  color: var(--muted); font-size: 11px; padding: 0 30px; }
.chip { display: inline-block; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
  color: var(--txt); border-radius: 999px; padding: 8px 18px; font-size: 22px; }
.meter { height: 16px; border-radius: 999px; background: rgba(255,255,255,0.10); margin-top: 12px; overflow: hidden; }
.meter-fill { height: 100%; border-radius: 999px; background: var(--accent); }
.vcenter { display: flex; align-items: center; justify-content: center; }
</style>
</head>
