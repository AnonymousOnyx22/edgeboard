{% include '_slide_head.html' %}
<body>
  <div class="wrap">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span class="chip">WEEKLY REPORT</span>
      <span class="chip">Week {{ ep.week | default('?') }}</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
      <div class="h1" style="font-size:80px; text-transform:uppercase;">The numbers</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:40px;">
        <div style="text-align:center; background:rgba(255,255,255,0.05); border-radius:20px; padding:26px 0;">
          <div class="h1" style="font-size:56px;">{{ record.wins }}</div><div class="small">WINS</div>
        </div>
        <div style="text-align:center; background:rgba(255,255,255,0.05); border-radius:20px; padding:26px 0;">
          <div class="h1 bad" style="font-size:56px;">{{ record.losses }}</div><div class="small">LOSSES</div>
        </div>
        <div style="text-align:center; background:rgba(255,255,255,0.05); border-radius:20px; padding:26px 0;">
          <div class="h1 accent" style="font-size:56px;">{{ record.units }}</div><div class="small">UNITS</div>
        </div>
        <div style="text-align:center; background:rgba(255,255,255,0.05); border-radius:20px; padding:26px 0;">
          <div class="h1" style="font-size:56px;">{{ record.hit_rate }}</div><div class="small">HIT RATE</div>
        </div>
      </div>
      {% if note %}
      <div class="emo" style="margin-top:36px; font-size:30px; color:var(--muted);">{{ note }}</div>
      {% endif %}
    </div>
  </div>
  <div class="disclaimer">{{ disclaimer }}</div>
</body>
</html>
