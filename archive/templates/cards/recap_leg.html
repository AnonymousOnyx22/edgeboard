{% include '_slide_head.html' %}
<body>
  <div class="wrap">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span class="chip">RECAP · {{ recap_date }}</span>
      <span class="chip">{{ sport_label | upper }}</span>
    </div>

    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:22px;">
      <div class="h1" style="font-size:76px; text-transform:uppercase;">How did we do?</div>
      {% for item in legs %}
      <div style="display:flex; align-items:center; justify-content:space-between; background:rgba(255,255,255,0.05);
                  border-radius:20px; padding:24px 30px;">
        <span class="emo" style="font-size:42px; width:70px; text-align:center;">{{ item.icon }}</span>
        <span style="font-size:30px; flex:1;">{{ item.label }}</span>
        <span class="h1" style="font-size:32px; color:var(--{{ 'good' if item.result=='W' else ('bad' if item.result=='L' else 'muted') }});">{{ item.result }}</span>
      </div>
      {% endfor %}
      {% if missed %}
      <div style="margin-top:12px; color:var(--muted); font-size:26px;">{{ missed }}</div>
      {% endif %}
    </div>
  </div>
  <div class="disclaimer">{{ disclaimer }}</div>
</body>
</html>
