{% include '_slide_head.html' %}
<body>
  <div class="wrap">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span class="chip">BIGGEST EDGE</span>
      <span class="chip">{{ ep.date }}</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
      <div class="emo" style="font-size:90px;">💎</div>
      <div class="h1" style="font-size:80px; text-transform:uppercase; margin-top:12px;">{{ hook }}</div>
      {% if matchup %}
      <div style="margin-top:34px; font-size:44px;">{{ matchup }}</div>
      {% endif %}
      {% if bet_label %}
      <div style="margin-top:26px;"><span class="chip h1" style="font-size:36px;">{{ bet_label }} <span class="accent">{{ odds }}</span></span></div>
      {% endif %}
      {% if edge_label %}
      <div style="margin-top:22px; font-size:30px; color:var(--accent);">{{ edge_label }}</div>
      {% endif %}
      {% if reason %}
      <div class="emo" style="margin-top:30px; font-size:30px; color:var(--muted);">{{ reason }}</div>
      {% endif %}
    </div>
  </div>
  <div class="disclaimer">{{ disclaimer }}</div>
</body>
</html>
