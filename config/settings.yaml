# Central tuning for the parlay picker: stat model, confidence, parlay search.

edge:
  # 214 graded picks: the model said 64% on average, they won 54%, and the
  # book's vig-free price said 54%. So the price gets most of the weight and
  # every edge below is measured after that blend (raw gap x 0.30).
  market_trust: 0.70      # weight on the book's price in every probability
  max_raw_edge: 0.20      # raw gap past this is skipped (10-22, -39% at 1u)
  target: 0.02            # min blended edge to show a line (~6.7% raw)
  max_edge_display: 0.05  # blended edge that maps to a full 10 on the edge scale

confidence:
  # Confidence = clamp(round( wE*edge_score + wP*prob_score + wQ*quality_score ), 1, 10)
  weights:
    edge: 0.45
    probability: 0.35
    quality: 0.20
  display: "scale"        # "scale" -> 8/10  |  "percent" -> 80%  |  "stars" -> *****
  quality_penalties:
    missing_starter_confirmation: 2.0   # starting QB not confirmed
    missing_injury_data: 1.0
    early_season_small_sample: 1.0      # fewer than N games of model history
    small_sample_threshold: 4
    missing_stat_feed: 1.0
    extreme_weather: 1.0
    no_head_to_head: 1.5                # these two have not met in the sample

# When the model is confident enough in a number it writes the pick to the
# ledger by itself, so the record builds without anyone choosing which bets to
# remember after the fact. Only upcoming games are ever committed.
auto_pick:
  enabled: true
  min_confidence: 6         # of 10
  min_edge: 0.02            # blended probability over the vig-free price
  # Paused after the record: moneylines -16u (5-9), NFL totals -20u (5-11).
  skip_markets:
    all: [h2h]
    nfl: [total]
  min_backing_games: 0      # require this many prior meetings on record
  min_backing_rate: ~       # and optionally that the bet cashed this often
  max_per_day: 100          # per sport: no real cap, every qualifying line counts
  status: approved          # approved = counts toward the tracked record
  # Player props go through the same gate as game lines. Only priced props are
  # ever committed - an unpriced projection has no edge to measure, and a
  # record built on the model marking its own homework is worth nothing.
  props:
    enabled: true
    min_confidence: 6       # of 10
    min_edge: 0.02          # blended probability over the vig-free price
    max_per_day: 100        # per sport: no real cap, every qualifying prop counts
    # Each game's FanDuel prop prices cost about 4 Odds API credits, so this is
    # the credit budget, not a quality bar. Raise it on a paid plan.
    max_games: 8            # soonest games to pull player data and prices for
    max_players: 20         # per team
    fetch_prices: true      # one Odds API credit per market per game
    require_h2h: false      # true = only players who have faced this opponent
    min_probability: 0.55

# Runs with the local dashboard. Prices remain cache-aware, so the hourly
# check does not waste Odds API credits when a fresh response already exists.
automation:
  enabled: true
  refresh_minutes: 60
  days: 7

units:
  # What one unit is worth, for showing a record in money as well as units.
  # Units are what the model actually stakes; this is display only, so
  # changing it re-reads history at the new size and never edits a pick.
  dollars_per_unit: 10
  # The bankroll the record is measured from, in units. The performance chart
  # starts here and each unit won or lost moves it one point, so a starting
  # bankroll in money is simply this times dollars_per_unit.
  starting_units: 100
  # Every pick stakes this many units while set; remove it to size by the
  # confidence tiers below once the probabilities have proven calibrated.
  flat: 1
  tiers:                  # overridable per-pick in the dashboard
    1: 5.5                # confidence <= 5.5  -> 1u
    2: 7.5                # confidence <= 7.5  -> 2u
    3: 10                 # confidence > 7.5   -> 3u

# Game-total model, per sport. `base` is the league-average total the model
# starts from; head-to-head scoring pulls it from there. Leave a sport out to
# use the default in src/data/sports.py.
total_model:
  nfl:
    base: 43.0
    sd: 12.0
  mlb:
    base: 8.5
    sd: 4.2
  nhl:
    base: 6.1
    sd: 2.5
  nba:
    base: 228.0
    sd: 18.0
  wnba:
    base: 162.0
    sd: 16.0

head_to_head:
  seasons_back: 6         # how far back to look for prior meetings
  max_meetings: 12        # most recent N meetings used, everywhere
  player_seasons: 3       # seasons of player gamelogs to pull (incl. current)

props:
  target_probability: 0.72   # the line search aims for this hit rate
  min_probability: 0.70      # props below this are not shown
  require_head_to_head: false  # true = only props with a prior game vs this opponent
  max_players_per_team: 12
  assumed_odds: -110         # props have no free market price; this is a display
                             # assumption only, and is labelled as such

parlay:
  min_legs: 2
  max_legs: 4
  allow_same_game: false     # true = same-game parlays, probability discounted
  search_pool: 18            # strongest N legs fed to the combination search
  min_leg_probability: 0.55

sports:
  nfl:
    enabled: true
    priority: 1
  mlb:
    enabled: true
    priority: 2
  nhl:
    enabled: true
    priority: 3
  nba:
    enabled: true
    priority: 4
  wnba:
    enabled: true
    priority: 5

# NFL games fall into kickoff windows; MLB and NHL do not.
kickoff_windows:
  nfl:
    - thursday
    - sunday_early
    - sunday_late
    - sunday_night
    - monday_night

# Odds API credit protection. Prop pulls cost one credit per market per game,
# so the picker refuses to spend below this many remaining credits.
credits:
  floor: 50

odds:
  api_base: "https://api.the-odds-api.com/v4/sports"
  region: "us"
  markets: ["h2h", "spreads", "totals"]
  cache_days: 1           # never re-fetch same-day odds within this window
  # Which books may be quoted. The "us" region also returns offshore books
  # (Bovada, LowVig, BetOnline, MyBookie) that are not available in Ontario,
  # and taking the best price across those invents edges against numbers
  # nobody here can actually bet. Set to ~ to allow every book the feed
  # returns. theScore Bet is not carried by The Odds API in any region
  # (checked against us, us2, uk, eu and au), so it cannot be priced here.
  # FanDuel only: every pick is a line and price you can actually bet there.
  bookmakers: ["fanduel"]
  preferred_book: fanduel

# Public service mode: accounts, plans, the 19+ age gate and the paywall.
# Off keeps this a private tool with everything unlocked. EDGEBOARD_SERVICE=1
# turns it on for a hosted copy without editing this file.
service:
  enabled: false
  plans:
    pro: {monthly: 14.99, yearly: 99}
    sharp: {monthly: 29.99, yearly: 199}
  # Stripe price ids; the STRIPE_PRICE_<PLAN>_<INTERVAL> env vars take precedence.
  # stripe_prices:
  #   pro: {monthly: price_xxx, yearly: price_xxx}
  #   sharp: {monthly: price_xxx, yearly: price_xxx}
