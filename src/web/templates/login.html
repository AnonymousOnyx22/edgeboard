{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='pages/account.css') }}">{% endblock %}
{% block content %}
<div class="auth auth-single">
  <section class="auth-panel" data-reveal="rise">
    <h1 class="page-title">Log in</h1>
    <p class="lede">Pick up where the board left off.</p>

    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}

    <form class="auth-form" method="post" action="{{ url_for('accounts.login') }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required value="{{ email }}">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="button primary auth-submit" type="submit">Log in</button>
      <p class="auth-switch">New here? <a href="{{ url_for('accounts.signup', next=next_url) }}">Make an account</a></p>
    </form>
  </section>
</div>
{% endblock %}
