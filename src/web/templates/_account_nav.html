{# The account block at the foot of the rail. Owner mode shows nothing. #}
{% if service_on %}
<div class="account-nav">
  {% if current_user %}
    <a class="account-chip {{ 'active' if active == 'account' }}" href="{{ url_for('accounts.account') }}">
      <span class="account-plan plan-{{ plan }}">{{ plans[plan].name }}</span>
      <span class="account-email">{{ current_user.email }}</span>
    </a>
    {% if plan == 'free' %}<a class="button primary small account-cta" href="{{ url_for('billing.pricing') }}">See paid plans</a>{% endif %}
  {% else %}
    <a class="button primary small account-cta" href="{{ url_for('accounts.signup') }}">Start free</a>
    <a class="button ghost small" href="{{ url_for('accounts.login', next=request.full_path.rstrip('?')) }}">Log in</a>
  {% endif %}
</div>
{% endif %}
